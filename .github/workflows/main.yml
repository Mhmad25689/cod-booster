name: Build COD Booster APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Files
        run: |
          sudo apt-get install -y p7zip-full || true
          if ls *.7z 1> /dev/null 2>&1; then 7z x -y *.7z; fi
          if ls *.zip 1> /dev/null 2>&1; then unzip -o *.zip; fi
          if [ ! -f "settings.gradle" ]; then
            sub=$(find . -maxdepth 2 -name "settings.gradle" -exec dirname {} \;)
            if [ -n "$sub" ] && [ "$sub" != "." ]; then cp -r "$sub"/* .; fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: COD-Booster-Daraa-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
