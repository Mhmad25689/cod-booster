name: Build Game Booster A07 Shizuku APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Latest Archive Cleanly
        run: |
          sudo apt-get install -y p7zip-full || true
          mkdir -p _clean_extract
          latest_archive=$(ls -t *.zip *.7z 2>/dev/null | head -n 1)
          echo "Using latest archive: $latest_archive"
          if [[ "$latest_archive" == *.zip ]]; then
            unzip -o "$latest_archive" -d _clean_extract
          elif [[ "$latest_archive" == *.7z ]]; then
            7z x -y "$latest_archive" -o_clean_extract
          fi
          sub=$(find _clean_extract -maxdepth 3 -name "settings.gradle" | head -n 1 | xargs dirname)
          if [ -n "$sub" ]; then
            rm -rf app
            cp -rf "$sub"/* .
          fi
          rm -rf _clean_extract

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-Booster-A07-Shizuku-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
